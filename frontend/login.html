<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — The Trust Layer</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <span class="brand-mark">TL</span>
        <span>The Trust Layer</span>
      </a>
      <nav class="nav-links">
        <a href="/verify.html" class="nav-link">Verify a Call</a>
        <a href="/company-register.html" class="nav-link">Register Company</a>
      </nav>
    </div>
  </header>

  <main class="container-auth dash-enter">
    <div class="card">
      <div class="card-header">
        <div>
          <h1 class="card-title">Portal Sign In</h1>
          <p class="card-subtitle">Sign in as a Platform Admin, Company Admin, or Authorized Employee.</p>
        </div>
      </div>

      <div id="login-error" class="alert alert-danger" hidden></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input class="form-control" id="login-email" type="email" required autocomplete="email" placeholder="name@company.example" />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input class="form-control" id="login-password" type="password" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary" id="login-submit" style="width:100%;">Sign In</button>
      </form>

      <div class="form-hint" style="margin-top:1rem;text-align:center;">
        Customers verifying a call do not need an account — <a href="/verify.html">go to Public Verification</a>.
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
