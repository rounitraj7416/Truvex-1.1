services:
  - type: web
    name: the-trust-layer
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python scripts/seed_demo.py && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_ID_EXPIRY_MINUTES
        value: "5"
      - key: CUSTOMER_SESSION_EXPIRY_MINUTES
        value: "30"
      - key: AI_PROVIDER
        value: mock
      - key: DETECTIFAI_API_BASE_URL
        value: https://platform.detectif.ai
      - key: DETECTIFAI_API_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@trustlayer.demo
      - key: SEED_ADMIN_PASSWORD
        sync: false
